[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropout-prediction"
version = "1.0.0"
description = "Machine learning models for predicting dropout risk in a Science and Technology undergraduate programme"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["educational data mining", "dropout prediction", "machine learning", "CRISP-DM"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
dropout-prediction = "dropout_prediction.__main__:main"

[tool.setuptools]
packages = ["dropout_prediction"]

[tool.ruff]
line-length = 100
target-version = "py310"
